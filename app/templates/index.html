<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI-Driven Resume Analyzer</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
  </head>
  <body class="bg-light">
    <div class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow-sm">
            <div class="card-body">
              <h1 class="card-title mb-4 text-center">Resume Analyzer</h1>
              <form
                class="needs-validation"
                method="post"
                action="/analyze"
                enctype="multipart/form-data"
              >
                <div class="mb-3">
                  <label for="resume" class="form-label">Upload Resume (PDF/DOCX)</label>
                  <input
                    class="form-control"
                    type="file"
                    id="resume"
                    name="resume"
                    accept=".pdf,.doc,.docx"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label for="job_description" class="form-label"
                    >Job Description (optional)</label
                  >
                  <textarea
                    class="form-control"
                    id="job_description"
                    name="job_description"
                    rows="6"
                    placeholder="Paste the job description here"
                  >{{ analysis.job_description if analysis else '' }}</textarea>
                </div>
                <div class="d-grid">
                  <button class="btn btn-primary" type="submit">Analyze Resume</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>

      {% if analysis %}
      <div class="row justify-content-center mt-4">
        <div class="col-lg-10">
          <div class="card shadow-sm">
            <div class="card-body">
              <h2 class="card-title">Extracted Resume Text</h2>
              <p class="text-muted mb-1">
                Analysis ID: <span class="fw-semibold">{{ analysis.id }}</span>
              </p>
              <pre class="bg-light p-3 border rounded small" style="white-space: pre-wrap">{{ analysis.resume_text }}</pre>

              {% if analysis.job_description %}
              <h3 class="mt-4">Provided Job Description</h3>
              <pre class="bg-light p-3 border rounded small" style="white-space: pre-wrap">{{ analysis.job_description }}</pre>
              {% endif %}
            </div>
          </div>
        </div>
      </div>
      {% endif %}
    </div>
  </body>
</html>
